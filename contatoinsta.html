<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre Leutz</title>
</head>
<body>
    <script>
        const urlBase = "https://pagina-de-venda-dap-default-rtdb.firebaseio.com/18-01-25/";
        const destino = "https://wa.me/5547997336957?text=Olá!%20Quero%20saber%20mais%20sobre%20o%20curso%20de%20programação";
        const id = Date.now();
        const isProd = ["carlos-alexandre-leutz.github.io", "alexandreleutz.com.br"].includes(window.location.hostname);

        function obterTipoDispositivo() {
            return window.innerWidth <= 800 ? "mobile" : "desktop";
        }

        function redirecionar() {
            window.location.href = destino;
        }

        function save() {
            if (!isProd) return redirecionar();

            const params = new URLSearchParams(window.location.search);
            const dados = {
                tipoDispositivo: obterTipoDispositivo(),
                dataDeEntrada: new Date().toISOString(),
                utm_source: params.get('utm_source'),
                utm_medium: params.get('utm_medium'),
                utm_campaign: params.get('utm_campaign')
            };

            fetch(`${urlBase}${id}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            })
            .catch(() => {})
            .finally(redirecionar);
        }
        window.onload = save;
    </script>

</body>
</html>
